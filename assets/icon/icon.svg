<?xml version="1.0" encoding="UTF-8"?>
<!-- Source for the app icon. Regenerate the platform icons with tool/make_icons.sh.
     1024x1024 canvas on Apple's icon grid: the tile is 824x824 at (100,100). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232933"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FB3D9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7FD3F2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="body" filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- live value trace -->
  <path d="M 200 330 C 250 330 262 220 312 220 S 374 400 424 400 S 486 250 536 250
           S 598 360 648 360 S 710 210 760 210 S 812 290 824 300"
        fill="none" stroke="url(#wave)" stroke-width="30" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- aggregate rows: level dot, count pill, message bar -->
  <g>
    <rect x="200" y="485" width="624" height="96" rx="26" fill="#2B313B"/>
    <circle cx="252" cy="533" r="22" fill="#6CC27A"/>
    <rect x="298" y="513" width="92" height="40" rx="20" fill="#4FB3D9" fill-opacity="0.85"/>
    <rect x="412" y="519" width="362" height="28" rx="14" fill="#D7DCE3"/>

    <rect x="200" y="613" width="624" height="96" rx="26" fill="#1F242C"/>
    <circle cx="252" cy="661" r="22" fill="#E5B84B"/>
    <rect x="298" y="641" width="68" height="40" rx="20" fill="#8A93A1" fill-opacity="0.7"/>
    <rect x="388" y="647" width="290" height="28" rx="14" fill="#8A93A1"/>

    <rect x="200" y="741" width="624" height="96" rx="26" fill="#1F242C"/>
    <circle cx="252" cy="789" r="22" fill="#EF6B6B"/>
    <rect x="298" y="769" width="68" height="40" rx="20" fill="#8A93A1" fill-opacity="0.7"/>
    <rect x="388" y="775" width="330" height="28" rx="14" fill="#8A93A1"/>
  </g>
</svg>
