; SerialMonitor test bench: firmware that exercises every feature of the
; monitor (graphs, levels/colours, row aggregation, commands, restarts).
;
;   cd esp32/examples/testbench
;   pio run -t upload                       ; classic ESP32 (USB-UART bridge)
;   pio run -e esp32-s3 -t upload           ; ESP32-S3, native USB port
;   pio run -e esp32-c3 -t upload           ; ESP32-C3, native USB port
;
; Then in SerialMonitor: menu -> "Load protocol file..." ->
; examples/testbench.smp.json (the device also announces its commands itself).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../SerialMonitorProtocol
; Makes the SerialMonitor app let go of the port while `pio run -t upload` runs.
extra_scripts = post:../../../tool/pio_smp_hook.py

[env:esp32dev]
board = esp32dev

; Boards whose "USB" connector goes straight to the chip: Serial is the USB
; CDC port, so print there instead of on UART0.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
