name: serial_monitor
description: A serial monitor that keeps one updating row per kind of message instead of scrolling.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_libserialport: ^0.6.0
  file_selector: ^1.0.3

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
